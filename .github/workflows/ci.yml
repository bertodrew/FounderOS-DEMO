name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` needs the lockfile to match package.json exactly, which is the
      # point: a drifted lockfile fails here instead of at deploy time.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Never point a CI build at a real store.
          FOUNDER_OS_DB: ':memory:'

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The repo's rule is that credentials never enter git. Enforce it rather
      # than trusting it: fail the PR if a tracked file looks like a live key.
      - name: Reject tracked credential files
        run: |
          tracked=$(git ls-files | grep -iE '(^|/)\.env($|\.)|\.env\.local|\.db$|secrets?\.(json|ya?ml)$' | grep -v '\.env\.example' || true)
          if [ -n "$tracked" ]; then
            echo "::error::credential-shaped files are tracked in git:"
            echo "$tracked"
            exit 1
          fi

      - name: Reject live key material in tracked files
        run: |
          # Long, high-entropy provider prefixes only — short/placeholder values
          # in .env.example must not trip this.
          if git grep -nIE '(sk-ant-api[0-9]{2}-|sk_live_[A-Za-z0-9]{20,}|xoxb-[0-9]{10,}-|ghp_[A-Za-z0-9]{36})' -- . ':!.github/workflows/ci.yml'; then
            echo "::error::live key material found in a tracked file"
            exit 1
          fi
